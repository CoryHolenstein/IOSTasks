AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model (SAM) template describing your function.
Resources:
  TaskOrganizerTaskIntegration:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      CodeUri: ./src
      Description: ''
      EphemeralStorage:
        Size: 512
      Handler: index.handler
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/TaskOrganizer-TaskIntegration
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: nodejs24.x
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags: {}
      Timeout: 3
      Tracing: PassThrough
      Events:
        Trigger1Event:
          Type: HttpApi
          Properties:
            Method: ANY
            Path: /tasks/get-all-tasks
        Trigger2Event:
          Type: HttpApi
          Properties:
            Method: ANY
            Path: /tasks/delete-task
        Trigger3Event:
          Type: HttpApi
          Properties:
            Method: ANY
            Path: /tasks/create-task
        Trigger4Event:
          Type: HttpApi
          Properties:
            Method: ANY
            Path: /tasks/edit-task
